id: com.sublimehq.SublimeText
runtime: org.freedesktop.Sdk
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: subl

separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.gnome.SettingsDaemon
  - --filesystem=host

modules:
  - name: sublime
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib
      - install -Dm755 apply_extra -t /app/bin
      - install -Dm755 subl /app/bin/subl
      - install -Dm644 ${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 ${FLATPAK_ID}-256.png /app/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
    sources:
      - type: extra-data
        only-arches: [x86_64]
        filename: sublime.tar.xz
        url: https://download.sublimetext.com/sublime_text_build_4215_x64.tar.xz
        sha256: c153f418d3ab26b90ecce8c02a82e4e961025ed7a65f7e25060a5457d43e88d9
        size: 22300732
        x-checker-data:
          type: html
          url: https://www.sublimetext.com/download_thanks
          version-pattern: https://download.sublimetext.com/sublime_text_build_([\d\.-]*)_x64.tar.xz
          url-template: https://download.sublimetext.com/sublime_text_build_${version}_x64.tar.xz
      - type: extra-data
        only-arches: [aarch64]
        filename: sublime.tar.xz
        url: https://download.sublimetext.com/sublime_text_build_4215_arm64.tar.xz
        sha256: d314665a4272f33551503432372a34516dbb5a9a12dce2a47042c1942f66ee79
        size: 21568308
        x-checker-data:
          type: html
          url: https://www.sublimetext.com/download_thanks
          version-pattern: https://download.sublimetext.com/sublime_text_build_([\d\.-]*)_arm64.tar.xz
          url-template: https://download.sublimetext.com/sublime_text_build_${version}_arm64.tar.xz
      - type: file
        path: com.sublimehq.SublimeText.desktop
      - type: file
        path: com.sublimehq.SublimeText.metainfo.xml
      - type: file
        path: com.sublimehq.SublimeText-256.png
      - type: script
        dest-filename: subl
        commands:
          - exec /app/extra/sublime_text/sublime_text --fwdargv0 "$0" "$@"
      - type: script
        dest-filename: apply_extra
        commands:
          - mkdir -p extract
          - tar -xJf sublime.tar.xz -C extract
          - mv extract/sublime_text ./
          - rm -rf extract sublime.tar.xz
